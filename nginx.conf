# Becomes /etc/nginx/conf.d/default.conf when the container starts: the nginx
# image fills in ${PORT} from the environment. Railway sets PORT; elsewhere it
# is 80, from the Dockerfile.
# Only tartanhacks.com should appear in search results. Every other address
# this container answers on (previews, platform domains) asks not to be indexed.
map $host $robots_tag {
    default              "noindex, nofollow";
    tartanhacks.com      "";
    www.tartanhacks.com  "";
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # nginx drops inherited add_header lines in any block that sets its own,
    # so each location repeats the security headers.

    # Health checks: /healthz for Sheltie, /health for Railway.
    location ~ ^/(healthz|health)$ {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fingerprinted by the build: safe to cache for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
}
